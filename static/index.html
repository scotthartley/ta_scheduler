    modalTitle: 'Add Outside Proctoring', placeholder: 'e.g. Makeup exam',
    defaultValue: 1.0, defaultLabel: 'Proctoring',
    afterChange: () => { updateProctorPETotals(); renderProctorTASummary($id('proctor-ta-summary')); },
  },
};

function renderLoadSection(which) {
  const cfg = LOAD_SECTIONS[which];
  const sec = $id(cfg.sectionId);
  if (!sec) return;
  sec.innerHTML = '';

  const hdr = el('div','od-section-hdr');
  hdr.appendChild(el('h4','section-h4',cfg.title));
  const addBtn = el('button','btn-sm',cfg.addLabel);
  addBtn.title = cfg.addTitle;
  addBtn.onclick = () => openAddLoadModal(which);
  hdr.appendChild(addBtn);
  sec.appendChild(hdr);
  sec.appendChild(el('p','help-text',cfg.hint));

  const rows = [];
  S.data.tas.forEach(ta => (ta[cfg.field]||[]).forEach((entry,i) => rows.push({ta,entry,i})));
  if (!rows.length) return;

  sec.appendChild(buildTable(['TA','Duty',cfg.unit,''], rows.map(({ta, entry, i}) => {
    const nameInp = document.createElement('input');
    nameInp.type = 'text'; nameInp.value = entry.label||''; nameInp.className = 'w-full';
    nameInp.oninput = () => { entry.label = nameInp.value; markDirty(); };

    const valInp = document.createElement('input');
    valInp.type = 'number'; valInp.step = '0.5'; valInp.min = '0';
    valInp.value = entry[cfg.valueKey] || 0;
    valInp.oninput = () => {
      entry[cfg.valueKey] = parseFloat(valInp.value) || 0;
      markDirty(); cfg.afterChange();
    };

    return [
      strongCell(ta.name), nameInp, valInp,
      xBtn(() => {
        ta[cfg.field].splice(i,1);
        markDirty(); renderLoadSection(which); cfg.afterChange();
      }, 'Remove'),
    ];
  })));
}

function renderOutsideDuties()     { renderLoadSection('duties'); }
function renderOutsideProctoring() { renderLoadSection('proctoring'); }

function openAddLoadModal(which) {
  const cfg = LOAD_SECTIONS[which];
  if (!S.data.tas.length) { alert('No TAs defined.'); return; }
  showModal(`
    <div class="modal-box">
      <h2>${escHtml(cfg.modalTitle)}</h2>
      <div class="form-group"><label>TA<br><select id="load-ta-sel" style="margin-top:4px;"></select></label></div>
      <div class="form-group" style="margin-top:10px;"><label>Duty label<br><input id="load-label" type="text" placeholder="${escHtml(cfg.placeholder)}" style="margin-top:4px;"></label></div>
      <div class="form-group" style="margin-top:10px;"><label>${cfg.unit} value<br><input id="load-value" class="num-input" type="number" step="0.5" min="0" value="${cfg.defaultValue}" style="margin-top:4px;"></label></div>
      <div class="modal-footer">
        <button class="btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn-sm btn-primary" onclick="confirmAddLoad('${which}')">Add</button>
      </div>
    </div>`);
  const sel = $id('load-ta-sel');
  S.data.tas.forEach(ta => {
    const o = document.createElement('option'); o.value=ta.id; o.textContent=ta.name;
    sel.appendChild(o);
  });
}

function confirmAddLoad(which) {
  const cfg = LOAD_SECTIONS[which];
  const ta = S.data.tas.find(t => t.id === $id('load-ta-sel').value);
  if (!ta) return;
  ta[cfg.field] = ta[cfg.field] || [];
  ta[cfg.field].push({
    label: $id('load-label').value.trim() || cfg.defaultLabel,
    [cfg.valueKey]: parseFloat($id('load-value').value) || 0,
  });
  markDirty();
  closeModal();
  renderLoadSection(which);
  cfg.afterChange();
}

// ── Assignment modal (shared by lab roles and exam proctoring) ──
// config: {titleHtml, subtitleHtml?, isAssigned(ta), loadInfo(ta),
//          conflictReasons(ta), onToggle(ta, isAssigned)}
function openAssignPicker(cfg) {
  const eligible = [], conflicted = [], assigned = [];
  S.data.tas.forEach(ta => {
    if (cfg.isAssigned(ta)) { assigned.push(ta); return; }
    const reasons = cfg.conflictReasons(ta);
    if (reasons.length) conflicted.push({ta, reasons});
    else eligible.push(ta);
  });

  showModal(`
    <div class="modal-box">
      <h2>${cfg.titleHtml}</h2>
      ${cfg.subtitleHtml ? `<h3>${cfg.subtitleHtml}</h3>` : ''}
      <div class="picker-list" id="assign-ta-list"></div>
      <div class="modal-footer">
        <button class="btn-sm" onclick="closeModal()">Close</button>
      </div>
    </div>`);

  const listDiv = $id('assign-ta-list');

  function makeRow(ta, isAssigned, reasons) {
    const row = el('div','assign-ta-row'
      + (isAssigned ? ' is-assigned' : reasons ? ' has-conflict' : ''));
    row.append(
      el('span', `exp-badge${ta.experience!=='experienced'?' inexp':''}`,
         ta.experience==='experienced'?'exp':'inexp'),
      el('span', null, escHtml(ta.name)),
      el('span', 'ok-check', isAssigned ? ' ✓' : ''),
      el('span', 'se-info', cfg.loadInfo(ta)),
    );
    if (reasons) row.appendChild(el('div','assign-reason','⚠ ' + reasons.join('; ')));
    row.onclick = () => { cfg.onToggle(ta, isAssigned); markDirty(); closeModal(); cfg.rerender(); };
    return row;
  }

  assigned.forEach(ta => listDiv.appendChild(makeRow(ta, true, null)));

  if (!eligible.length && !conflicted.length) {
    listDiv.appendChild(el('div','ilist-empty','No TAs available'));
    return;
  }

  eligible.forEach(ta => listDiv.appendChild(makeRow(ta, false, null)));

  if (conflicted.length) {
    listDiv.appendChild(el('div','assign-divider','— or override conflict —'));
    conflicted.forEach(({ta, reasons}) => listDiv.appendChild(makeRow(ta, false, reasons)));
  }
}

function openAssignModal(lab, rr, rolesMap) {
  const role = rolesMap[rr.role_id];
  const addSE = role?.se_value || 0;
  const existing = new Set(
    S.data.assignments
      .filter(a => a.lab_id===lab.id && a.role_id===rr.role_id)
      .map(a => a.ta_id)
  );

  // usedSE was recomputed three times per row before; do it once per TA.
  const rolesById = Object.fromEntries(S.data.roles.map(r=>[r.id,r]));
  const usedSE = {};
  S.data.tas.forEach(ta => { usedSE[ta.id] = (ta.outside_duties||[]).reduce((s,d)=>s+(d.se_value||0),0); });
  S.data.assignments.forEach(a => {
    if (a.ta_id in usedSE) usedSE[a.ta_id] += rolesById[a.role_id]?.se_value || 0;
  });

  openAssignPicker({
    titleHtml: `Assign TA — ${escHtml(displayName(lab))}`,
    subtitleHtml: `Role: ${escHtml(role?.label||rr.role_id)}`,
    isAssigned: ta => existing.has(ta.id),
    loadInfo: ta => `SE: ${usedSE[ta.id].toFixed(1)}/${Number(ta.max_se).toFixed(1)}`,
    conflictReasons: ta => {
      // Cap check is modal-only; the shared helper covers the time conflicts.
      const reasons = [];
      if (usedSE[ta.id] + addSE > ta.max_se + 0.001) {
        reasons.push(`SE: ${(usedSE[ta.id]+addSE).toFixed(1)}/${Number(ta.max_se).toFixed(1)} (over cap)`);
      }
      return reasons.concat(taLabConflictReasons(ta, lab));
    },
    onToggle: (ta, isAssigned) => {
      if (isAssigned) {
        S.data.assignments = S.data.assignments.filter(
          a => !(a.lab_id===lab.id && a.role_id===rr.role_id && a.ta_id===ta.id));
      } else {
        S.data.assignments.push({lab_id:lab.id, role_id:rr.role_id, ta_id:ta.id, locked:true});
      }
    },
    rerender: renderSchedule,
  });
}

function mailtoBtn(tas, label, { alwaysShow = false } = {}) {
  const withEmail = tas.filter(ta => ta && ta.email);
  if (!withEmail.length && !alwaysShow) return null;
  const a = el('a', 'btn-sm');
  a.textContent = label;
  if (withEmail.length) {
    a.href = 'mailto:?bcc=' + encodeURIComponent(withEmail.map(ta => ta.email).join(','));
    // pywebview's WKWebView silently drops same-window mailto: navigation; only
    // new-window link activations get handed to the OS mail handler.
    a.target = '_blank';
  } else {
    a.classList.add('btn-disabled');
    a.setAttribute('aria-disabled', 'true');
  }
  return a;
}

// The one table builder. A cell may be a string, a DOM node, or an array of
// nodes, so schedule tables with live inputs and chips go through it too.
function buildTable(headers, rows, totalRows = 0) {
  const wrap = el('div', 'data-table-wrap');
  const tbl = el('table', 'data-table');
  const thead = tbl.createTHead();
  const hrow = thead.insertRow();
  for (const h of headers) {
    const th = document.createElement('th');
    th.textContent = h;
    hrow.append(th);
  }
  const tbody = tbl.createTBody();
  rows.forEach((cols, i) => {
    const tr = tbody.insertRow();
    if (totalRows > 0 && i >= rows.length - totalRows) tr.classList.add('summary-total');
    for (const col of cols) {
      const td = tr.insertCell();
      if (Array.isArray(col)) td.append(...col);
      else if (col instanceof Node) td.append(col);
      else td.textContent = col;
    }
  });
  wrap.append(tbl);
  return wrap;
}

// Shared by the on-screen TA Assignments tables and the per-TA email body —
// computes each TA's lab/proctoring rows (with totals) exactly once.
function taAssignmentSummary(ta, d, { rolesMap, labsMap, examsMap, proctorAsgn }) {
  const taAsgn    = d.assignments.filter(a => a.ta_id === ta.id);
  const outside   = ta.outside_duties ?? [];
  const taProctor = [...proctorAsgn.filter(a => a.ta_id === ta.id)].sort((a,b) => {
    const ea = examsMap[a.exam_id]??{}, eb = examsMap[b.exam_id]??{};
    return ((ea.course_name||'')+' '+(ea.section||'')+' '+(ea.date||''))
           .localeCompare((eb.course_name||'')+' '+(eb.section||'')+' '+(eb.date||''));
  });
  const outsideProctor = ta.outside_proctoring ?? [];

  let totalSE = 0;
  const seRows = [];
  const seLines = [];
  if (taAsgn.length || outside.length) {
    for (const a of [...taAsgn].sort((a,b) => {
        const la = labsMap[a.lab_id]??{}, lb = labsMap[b.lab_id]??{};
        return (la.day??0)*10000+(la.start_min??0) - ((lb.day??0)*10000+(lb.start_min??0));
      })) {
      const lab  = labsMap[a.lab_id] ?? {};
      const role = rolesMap[a.role_id] ?? {};
      const se   = role.se_value ?? 0;
      totalSE += se;
      const time = fmtMeetings(lab, DAY_SHORT);
      seRows.push([displayName(lab)||'—', role.label||'—', time, se.toFixed(1)]);
      const courseSection = displayName(lab) || '—', roleLabel = role.label || '—';
      seLines.push(time === '—' ? `${courseSection}, ${roleLabel}` : `${courseSection}, ${roleLabel}: ${time}`);
    }
    for (const od of outside) {
      const se = od.se_value ?? 0;
      totalSE += se;
      seRows.push([od.label||'Other Duty', 'Other Duty', '—', se.toFixed(1)]);
      seLines.push(od.label || 'Other Duty');
    }
    seRows.push(['Total SE', '', '', `${totalSE.toFixed(1)} / ${(ta.max_se??2).toFixed(1)}`]);
  }

  let totalPE = 0;
  const peRows = [];
  const peLines = [];
  if (taProctor.length || outsideProctor.length) {
    for (const pa of taProctor) {
      const exam  = examsMap[pa.exam_id] ?? {};
      const pe    = exam.pe_value ?? 0;
      totalPE += pe;
      peRows.push([
        examFullLabel(exam),
        exam.date || '—',
        exam.date ? fmtRange(exam.start_min, exam.end_min) : '—',
        pe.toFixed(1),
      ]);
      const courseSection = examLabel(exam, ''), examName = exam?.name || '';
      const examTitle = (courseSection && examName && examName !== courseSection)
        ? `${courseSection}, ${examName}` : (courseSection || examName || 'Exam');
      const when = exam.date ? `${fmtDateUS(exam.date)} ${fmtRange(exam.start_min, exam.end_min)}` : '';
      peLines.push(when ? `${examTitle}: ${when}` : examTitle);
    }
    for (const op of outsideProctor) {
      const pe = op.pe_value ?? 0;
      totalPE += pe;
      peRows.push([op.label || 'Outside Proctoring', '—', '—', pe.toFixed(1)]);
      peLines.push(op.label || 'Outside Proctoring');
    }
    peRows.push(['Total PE', '', '', totalPE.toFixed(1)]);
  }

  const hasAny = !!(taAsgn.length || outside.length || taProctor.length || outsideProctor.length);

  return { seRows, seLines, totalSE, peRows, peLines, totalPE, hasAny };
}

const EMAIL_SCOPE_SUBJECTS = {
  all: 'TA Assignment', labs: 'TA Lab Assignment', proctoring: 'TA Proctoring Assignment',
};
const EMAIL_SCOPE_EMPTY = {
  all: 'No assignments', labs: 'No lab assignments', proctoring: 'No proctoring assignments',
};

// Plain-text mailto body — mailto: only supports an unformatted body, so this
// renders labeled lines rather than the aligned columns buildTable() produces.
// scope narrows the body to just one section ('labs' / 'proctoring'), or 'all' for both.
function taAssignmentEmailBody(ta, summary, scope = 'all') {
  const showLabs       = scope !== 'proctoring' && summary.seLines.length;
  const showProctoring = scope !== 'labs' && summary.peLines.length;
  if (!showLabs && !showProctoring) return EMAIL_SCOPE_EMPTY[scope];
  const lines = [];
  if (showLabs) {
    lines.push('Lab Assignments:');
    for (const line of summary.seLines) lines.push(`  ${line}`);
  }
  if (showProctoring) {
    if (lines.length) lines.push('');
    lines.push('Proctoring:');
    for (const line of summary.peLines) lines.push(`  ${line}`);
  }
  return lines.join('\n');
}

function taMailtoHref(ta, summary, scope = 'all') {
  if (!ta.email) return null;
  return 'mailto:' + ta.email
    + '?subject=' + encodeURIComponent(EMAIL_SCOPE_SUBJECTS[scope])
    + '&body=' + encodeURIComponent(taAssignmentEmailBody(ta, summary, scope));
}

function renderSummary() {
  const c = $id('summary-workspace');
  c.innerHTML = '';
  const d = S.data;

  const rolesMap  = Object.fromEntries(d.roles.map(r => [r.id, r]));
  const tasMap    = Object.fromEntries(d.tas.map(t => [t.id, t]));
  const labsMap   = Object.fromEntries(d.labs.map(l => [l.id, l]));
  const examsMap  = Object.fromEntries((d.exams||[]).map(e => [e.id, e]));

  // ── Section 1: Lab Assignments ───────────────────────────────────────
  const h1 = el('h1','summary-h1'); h1.textContent = 'Lab Assignments'; c.append(h1);

  const labsByName = new Map();
  for (const lab of d.labs) {
    if (!labsByName.has(lab.name)) labsByName.set(lab.name, []);
    labsByName.get(lab.name).push(lab);
  }
  const courseNames = [...labsByName.keys()].sort((a,b) => a.localeCompare(b));

  for (const courseName of courseNames) {
    const courseLabs = [...labsByName.get(courseName)].sort((a,b) =>
      (a.section||'').localeCompare(b.section||''));

    const courseTaMap = new Map();
    for (const lab of courseLabs) {
      for (const a of d.assignments.filter(a => a.lab_id === lab.id)) {
        const ta = tasMap[a.ta_id];
        if (ta) courseTaMap.set(ta.id, ta);
      }
    }
    const courseTas = [...courseTaMap.values()];

    const ch = el('h2','summary-course-h with-action');
    const chtxt = el('span'); chtxt.textContent = courseName || '(unnamed course)'; ch.append(chtxt);
    const cmail = mailtoBtn(courseTas, 'Email TAs');
    if (cmail) { cmail.style.marginTop = '0'; ch.append(cmail); }
    c.append(ch);

    const sectionWrap = el('div','summary-course-sections');
    for (const lab of courseLabs) {
      const labAsgn = d.assignments.filter(a => a.lab_id === lab.id);
      const h2 = el('h2','summary-h2 with-action');
      const h2txt = el('span'); h2txt.textContent = displayName(lab); h2.append(h2txt);
      const labTas = labAsgn.map(a => tasMap[a.ta_id]).filter(Boolean);
      const mailBtn = mailtoBtn(labTas, 'Email TAs');
      if (mailBtn) { mailBtn.style.marginTop = '0'; h2.append(mailBtn); }
      sectionWrap.append(h2);
      const sub = el('p','summary-sub');
      const labTimes = fmtMeetings(lab, DAY_LONG);
      sub.textContent = labTimes === '—' ? '(time TBD)' : labTimes;
      sectionWrap.append(sub);

      if (labAsgn.length) {
        sectionWrap.append(buildTable(['Role','TA','Status'], labAsgn.map(a => [
          rolesMap[a.role_id]?.label ?? a.role_id,
          tasMap[a.ta_id]?.name    ?? a.ta_id,
          a.locked ? 'Locked' : 'Assigned',
        ])));
      } else {
        sectionWrap.append(el('p','summary-none','No assignments'));
      }
    }
    c.append(sectionWrap);
  }

  // ── Section 2: Exam Proctoring ───────────────────────────────────────
  const exams = d.exams ?? [];
  const proctorAsgn = d.proctor_assignments ?? [];
  const assignedExams = exams.filter(e => proctorAsgn.some(a => a.exam_id === e.id));
  if (assignedExams.length) {
    const h1p = el('h1','summary-h1'); h1p.textContent = 'Exam Proctoring'; c.append(h1p);
    const sortedExams = [...assignedExams].sort((a,b) =>
      ((a.course_name||'')+' '+(a.section||'')+' '+(a.date||''))
        .localeCompare((b.course_name||'')+' '+(b.section||'')+' '+(b.date||'')));

    for (const exam of sortedExams) {
      const sub2  = examFullLabel(exam);
      const eAsgn = proctorAsgn.filter(a => a.exam_id === exam.id);
      const h2e = el('h2','summary-h2 with-action');
      const h2etxt = el('span'); h2etxt.textContent = sub2; h2e.append(h2etxt);
      const examTas = eAsgn.map(a => tasMap[a.ta_id]).filter(Boolean);
      const examMailBtn = mailtoBtn(examTas, 'Email TAs');
      if (examMailBtn) { examMailBtn.style.marginTop = '0'; h2e.append(examMailBtn); }
      c.append(h2e);
      const subp = el('p','summary-sub');
      subp.textContent = examDateTimeLabel(exam);
      c.append(subp);

      const ul = el('ul','summary-proctor-list');
      for (const a of eAsgn) {
        const ta = tasMap[a.ta_id];
        const li = el('li');
        li.textContent = `${ta?.name ?? a.ta_id} (${a.locked ? 'Locked' : 'Assigned'})`;
        ul.append(li);
      }
      c.append(ul);
    }
  }

  // ── Section 3: TA Assignments ────────────────────────────────────────
  const taSummaries = new Map(d.tas.map(ta =>
    [ta.id, taAssignmentSummary(ta, d, { rolesMap, labsMap, examsMap, proctorAsgn })]));

  const h1t = el('h1','summary-h1 with-action');
  const h1ttxt = el('span'); h1ttxt.textContent = 'TA Assignments'; h1t.append(h1ttxt);
  const emailableTas = d.tas.filter(ta => ta.email);
  const emailAllSpecs = [
    ['Email All TAs', 'all', emailableTas],
    ['Email All TAs (Labs only)', 'labs', emailableTas.filter(ta => taSummaries.get(ta.id).seLines.length)],
    ['Email All TAs (Proctoring only)', 'proctoring', emailableTas.filter(ta => taSummaries.get(ta.id).peLines.length)],
  ];
  for (const [label, scope, tas] of emailAllSpecs) {
    const btn = el('button', 'btn-sm');
    btn.textContent = label;
    if (tas.length) {
      btn.onclick = () => {
        tas.forEach((ta, i) => {
          const href = taMailtoHref(ta, taSummaries.get(ta.id), scope);
          setTimeout(() => window.open(href, '_blank'), i * 180);
        });
      };
    } else {
      btn.classList.add('btn-disabled');
      btn.setAttribute('aria-disabled', 'true');
    }
    h1t.append(btn);
  }
  c.append(h1t);

  for (const ta of d.tas) {
    const summary = taSummaries.get(ta.id);
    const h2t = el('h2','summary-h2 with-action');
    const h2ttxt = el('span'); h2ttxt.textContent = ta.name; h2t.append(h2ttxt);
    const emailSpecs = [
      ['Email TA', 'all', true],
      ['Email TA (Labs only)', 'labs', summary.seLines.length > 0],
      ['Email TA (Proctoring only)', 'proctoring', summary.peLines.length > 0],
    ];
    for (const [label, scope, show] of emailSpecs) {
      if (!show) continue;
      const href = taMailtoHref(ta, summary, scope);
      if (!href) continue;
      const emailBtn = el('a', 'btn-sm');
      emailBtn.textContent = label;
      emailBtn.href = href;
      emailBtn.target = '_blank';
      h2t.append(emailBtn);
    }
    c.append(h2t);
    const meta = el('p','summary-sub');
    meta.textContent = `${(ta.experience||'').replace(/^\w/,ch=>ch.toUpperCase())}, Max SE: ${(ta.max_se??2).toFixed(1)}`;
    c.append(meta);
    if (ta.email) {
      const ep = el('p','summary-sub'); ep.textContent = ta.email; c.append(ep);
    }

    if (summary.seRows.length) {
      c.append(buildTable(['Lab','Role','Time','SE'], summary.seRows, 1));
    }

    if (summary.peRows.length) {
      c.append(el('p','summary-proctor-label','Proctoring'));
      c.append(buildTable(['Exam','Date','Time','PE'], summary.peRows, 1));
    }

    if (!summary.hasAny) {
      c.append(el('p','summary-none','No assignments'));
    }
  }
}

function renderMeetingFinder() {
  // ── Lab section filter ──────────────────────────────────────
  const labsWithAssignments = S.data.labs.filter(lab =>
    S.data.assignments.some(a => a.lab_id === lab.id)
  );
  const validIds = new Set(labsWithAssignments.map(l => l.id));

  if (!S.meetingLabFilter) {
    S.meetingLabFilter = new Set(validIds); // first render: all checked
  } else {
    for (const id of [...S.meetingLabFilter]) { // prune stale IDs
      if (!validIds.has(id)) S.meetingLabFilter.delete(id);
    }
  }

  const filterDiv = $id('meeting-filter');
  filterDiv.innerHTML = '';
  if (labsWithAssignments.length) {
    labsWithAssignments.forEach(lab => {
      const lbl = el('label', 'meeting-lab-row');
      const cb = document.createElement('input'); cb.type = 'checkbox';
      cb.checked = S.meetingLabFilter.has(lab.id);
      cb.onchange = () => {
        if (cb.checked) S.meetingLabFilter.add(lab.id);
        else S.meetingLabFilter.delete(lab.id);
        renderMeetingFinder();
      };
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(displayName(lab)));
      filterDiv.appendChild(lbl);
    });
  } else {
    filterDiv.appendChild(el('p','help-text meeting-empty','No lab sections with assignments yet'));
  }

  // ── Determine filtered TA set ────────────────────────────────
  const taIds = new Set(
    S.data.assignments
      .filter(a => S.meetingLabFilter.has(a.lab_id))
      .map(a => a.ta_id)
  );
  const filteredTAs = S.data.tas.filter(ta => taIds.has(ta.id));
  const numTAs = filteredTAs.length;

  // Build unavailability grid: busy[day][minute] = count
  const busy = Array.from({length:5}, () => new Uint8Array(GRID_MINS));
  const gcMap   = Object.fromEntries(S.data.grad_courses.map(gc=>[gc.id,gc]));
  const labsMap = Object.fromEntries(S.data.labs.map(l=>[l.id,l]));
  const labsByTa = {};
  S.data.assignments.forEach(a => (labsByTa[a.ta_id] = labsByTa[a.ta_id] || []).push(a.lab_id));

  filteredTAs.forEach(ta => {
    const mark = (day, s, e) => {
      if (day < 0 || day > 4) return;
      const lo = Math.max(0, s - GRID_START);
      const hi = Math.min(GRID_MINS, e - GRID_START);
      for (let m = lo; m < hi; m++) busy[day][m]++;
    };
    const markAll = src => getMeetings(src).forEach(m => mark(m.day, m.start_min, m.end_min));

    (ta.grad_course_ids||[]).forEach(id => markAll(gcMap[id]));
    (ta.other_commitments||[]).forEach(oc => mark(oc.day, oc.start_min, oc.end_min));
    (labsByTa[ta.id]||[]).forEach(labId => markAll(labsMap[labId]));
  });

  // Legend — built from the same stops flush() paints with, so it can't drift.
  const legend = $id('meeting-legend');
  legend.innerHTML = '';
  HEAT_STOPS.forEach((stop, i) => {
    const item = el('span');
    const sw = el('span','legend-swatch');
    // Mid-range alpha for the graded "some busy" band.
    sw.style.background = `rgba(${stop.rgb},${stop.alpha(i === 1 ? 0.5 : i === 0 ? 0 : 1)})`;
    item.append(sw, document.createTextNode(' ' + stop.label));
    legend.appendChild(item);
  });

  // Make grid body fill remaining height
  const mb = $id('meeting-body');
  mb.style.flex = '1'; mb.style.minHeight = '0';

  const mPct = (min) => ((min - GRID_START) / GRID_MINS * 100) + '%';

  // Time labels
  const tl = $id('meeting-time-labels');
  tl.innerHTML = '';
  for (let h=7; h<=19; h++) {
    const lbl = el('div','time-label', fmtTime(h*60));
    lbl.style.top = mPct(h*60);
    if (h === 19) lbl.style.transform = 'translateY(-100%)';
    tl.appendChild(lbl);
  }

  // Render each day column as heatmap
  for (let d=0; d<5; d++) {
    const col = $id(`meet-day-${d}`);
    col.innerHTML = '';

    // Hour lines
    for (let h=7; h<=19; h++) {
      const ln = el('div','hour-line'); ln.style.top = mPct(h*60); col.appendChild(ln);
    }

    if (!numTAs) continue;

    // Merge consecutive minutes with same busyness into segments
    let segStart = 0, segBusy = busy[d][0];
    const flush = (s, e, b) => {
      if (e <= s || !numTAs) return;
      const div = el('div','meeting-cell');
      div.style.top    = (s / GRID_MINS * 100) + '%';
      div.style.height = ((e - s) / GRID_MINS * 100) + '%';
      div.style.background = heatColor(b / numTAs);
      div.title = `${fmtTime(GRID_START+s)}–${fmtTime(GRID_START+e)}: ${numTAs-b}/${numTAs} free`;
      col.appendChild(div);
    };
    for (let m=1; m<GRID_MINS; m++) {
      if (busy[d][m] !== segBusy) {
        flush(segStart, m, segBusy);
        segStart = m; segBusy = busy[d][m];
      }
    }
    flush(segStart, GRID_MINS, segBusy);
  }

  // TA list below grid
  const taListDiv = $id('meeting-ta-list');
  taListDiv.innerHTML = '';
  if (filteredTAs.length) {
    const hdr = el('p'); hdr.innerHTML = '<strong>Assigned TAs</strong>';
    taListDiv.appendChild(hdr);
    const sorted = filteredTAs.slice().sort((a,b)=>a.name.localeCompare(b.name));
    const ul = el('ul','meeting-ta-ul');
    sorted.forEach(ta => {
      const li = el('li');
      li.textContent = ta.name + (ta.email ? ` — ${ta.email}` : '');
      ul.appendChild(li);
    });
    taListDiv.appendChild(ul);

    const mailBtn = mailtoBtn(sorted, 'Email TAs');
    if (mailBtn) taListDiv.appendChild(mailBtn);
  }
}

// One row of a roles .ilist — returns the item descriptor, not a node.
function roleListRow(role) {
  const lblInp = document.createElement('input'); lblInp.type='text';
  lblInp.value=role.label; lblInp.placeholder='Label'; lblInp.className='il-label';
  lblInp.oninput = () => { role.label=lblInp.value; markDirty(); syncItemForm(); };

  const seInp = document.createElement('input'); seInp.type='number';
  seInp.step='0.5'; seInp.min='0'; seInp.value=role.se_value; seInp.className='num-input';
  seInp.oninput = () => { role.se_value=parseFloat(seInp.value)||0; markDirty(); syncItemForm(); };

  const cells = [lblInp];
  if (role.course_name) cells.push(el('span','chip', escHtml(role.course_name)));
  cells.push(el('span','il-unit','SE'), seInp);

  return {
    cells,
    removeTitle: 'Remove role',
    onRemove: () => {
      S.data.roles = S.data.roles.filter(x => x !== role);
      S.data.labs.forEach(l => { l.roles = (l.roles||[]).filter(rr => rr.role_id !== role.id); });
      S.data.assignments = S.data.assignments.filter(a => a.role_id !== role.id);
      markDirty(); syncRolesPanel();
    },
  };
}

// Footer row of the Course Roles group: a course picker (from distinct lab
// names) + button. With no lab sections yet the footer renders disabled rather
// than replacing the whole control.
function addCourseRoleFooter() {
  const courseNames = [...new Set(S.data.labs.map(l => l.name).filter(Boolean))].sort();
  const select = document.createElement('select');
  select.className = 'il-label';
  const addBtn = el('button','btn-sm','+ Add Course Role');

  if (!courseNames.length) {
    const o = document.createElement('option');
    o.textContent = 'No lab sections yet'; select.appendChild(o);
    select.disabled = true;
    addBtn.classList.add('btn-disabled');
    addBtn.title = 'Add a lab section first to create course-specific roles.';
  } else {
    courseNames.forEach(name => {
      const o = document.createElement('option'); o.value = name; o.textContent = name;
      select.appendChild(o);
    });
    addBtn.onclick = () => addCourseRole(select.value);
  }
  return [select, addBtn];
}

function renderRolesList() {
  const div = $id('roles-list');
  if (!div) return;
  div.innerHTML = '';

// Refresh the open lab's form after a role edit that doesn't rebuild #roles-list itself.
function syncItemForm() {
  if (S.tab === 'labs' && S.selId) renderItemForm();
}

// Roles list was fully rebuilt (add/remove) — also refresh the open lab's form.
function syncRolesPanel() { renderRolesList(); syncItemForm(); }

function addRole() {
  S.data.roles.push({id:uid(), label:'New Role', se_value:1.0});
  markDirty(); syncRolesPanel();
}

// Manually add an additional (non-default) role scoped to a specific course.
function addCourseRole(courseName) {
  if (!courseName) return;
  S.data.roles.push({id: uid(), label: courseName + ' Role', se_value: 1.0, course_name: courseName});
  markDirty(); syncRolesPanel();
}

// Find-or-create the auto-managed default role for a course name.
function ensureCourseRole(courseName) {
  if (!courseName) return null;
  let role = S.data.roles.find(r => r.course_name === courseName);
  if (!role) {
    role = {id: uid(), label: courseName + ' TA', se_value: 1.0, course_name: courseName};
    S.data.roles.push(role);
  }
  return role;
}

// Ensure a lab has its course's default role attached with count >= 1.
function attachCourseRole(lab) {
  const role = ensureCourseRole(lab.name);
  if (!role) return;
  lab.roles = lab.roles || [];
  let rr = lab.roles.find(r => r.role_id === role.id);
  if (!rr) { rr = {role_id: role.id, count: 1, preferred_experienced: 0}; lab.roles.push(rr); }
  else if (rr.count < 1) { rr.count = 1; }
}

function showModal(html) {
  const backdrop = el('div','modal-backdrop');
  // .modal-box itself scrolls (overflow-y:auto) when its content is taller than
  // max-height, and browsers don't round a native scrollbar to match an
  // element's own border-radius. Wrapping it in a non-scrolling .modal-shell
  // that owns the radius + box-shadow clips the scrollbar to a rounded corner
  // instead of a square one, for every modal, without touching each caller.
  backdrop.innerHTML = `<div class="modal-shell">${html}</div>`;
  backdrop.onclick = e => { if (e.target===backdrop) closeModal(); };
  $id('modal-container').appendChild(backdrop);
  if ($id('import-grad-list')) renderImportGradList();
  if ($id('import-lab-list')) renderImportLabList();
  if ($id('import-exam-list')) renderImportExamList();
}
function closeModal() {
  const mc = $id('modal-container');
  if (mc.lastChild) mc.removeChild(mc.lastChild);
  // Re-render form in case roles were added/changed
  if (S.selId && ['courses','tas','labs'].includes(S.tab)) renderItemForm();
}

// ════════════════════════════════════════════════════════════════
async function importClassList() {
  try {
    const r = await fetch('/api/import-csv', { method: 'POST' });
    const result = await r.json();
    if (result.cancelled) return;
    if (result.error) { alert('Import failed:\n' + result.error); return; }
    const grad = result.grad_courses || [];
    const undergrad = result.undergrad_courses || [];
    if (!grad.length && !undergrad.length) {
      alert('No courses with meeting times found.'); return;
    }
    const examCourses = result.exam_courses || [];
    S._importGrad    = grad;
    const _existingGrad = new Set(
      S.data.grad_courses.map(c => `${c.name}|${c.section||''}`)
    );
    S._importGradChk = new Set(
      grad.reduce((acc, c, i) => {
        if (!_existingGrad.has(`${c.name}|${c.section||''}`)) acc.push(i);
        return acc;
      }, [])
    );
    S._importCourses = undergrad;
    S._importChecked = new Set();                       // none checked by default
    S._importExamCourses = examCourses;
    S._importExamChecked = new Set();                   // none checked by default
    showModal(`<div class="modal-box">
      <h2>Import Class Info</h2>
      ${grad.length ? `
        <h3>Graduate Courses (${grad.length})</h3>
        <div style="margin-bottom:6px;">
          <button class="btn-sm" onclick="importSelectAllGrad(true)">Select All</button>
          <button class="btn-sm" onclick="importSelectAllGrad(false)">Deselect All</button>
        </div>
        <div id="import-grad-list" class="picker-list"></div>
      ` : ''}
      ${undergrad.length ? `
        <h3>Lab Sections</h3>
        <p class="modal-note">Select courses to import all sections:</p>
        <div style="margin-bottom:6px;">
          <button class="btn-sm" onclick="importLabSelectAll(true)">Select All</button>
          <button class="btn-sm" onclick="importLabSelectAll(false)">Deselect All</button>
        </div>
        <div id="import-lab-list" class="picker-list"></div>
      ` : ''}
      ${examCourses.length ? `
        <h3>Courses with Exams (${examCourses.length})</h3>
        <p class="modal-note">Import exam sessions for proctoring:</p>
        <div style="margin-bottom:6px;">
          <button class="btn-sm" onclick="importExamSelectAll(true)">Select All</button>
          <button class="btn-sm" onclick="importExamSelectAll(false)">Deselect All</button>
        </div>
        <div id="import-exam-list" class="picker-list"></div>
      ` : ''}
      <div class="modal-footer">
        <button class="btn-sm" onclick="closeModal()">Cancel</button>
        <button class="btn-sm btn-primary" onclick="confirmImportAll()">Import Selected</button>
      </div>
    </div>`);
  } catch(e) { alert('Import failed: ' + e); }
}

function confirmImportAll() {
  const conflicts = [];
  // Check grad course conflicts
  (S._importGrad || []).forEach((c, i) => {
    if (!S._importGradChk.has(i)) return;
    const key = `${c.name}|${c.section||''}`;
    const existing = S.data.grad_courses.find(x => `${x.name}|${x.section||''}` === key);
    if (existing) {
      const dname = c.section ? `${c.name} ${c.section}` : c.name;
      conflicts.push({ type: 'grad', key, label: `Grad: ${dname}`, idx: i, incoming: c, existingId: existing.id });
    }
  });
  // Check lab section conflicts
  (S._importCourses || []).forEach(course => {
    const courseKey = `${course.subject} ${course.number}`;
    if (!S._importChecked.has(courseKey)) return;
    course.sections.forEach(sec => {
      const key = `${sec.name}|${sec.section||''}`;
      const existing = S.data.labs.find(x => `${x.name}|${x.section||''}` === key);
      if (existing) {
        conflicts.push({ type: 'lab', key, label: `Lab: ${sec.name}${sec.section ? ' ' + sec.section : ''}`, incoming: sec, existingId: existing.id });
      }
    });
  });
  // Check exam course conflicts
  S.data.exams = S.data.exams || [];
  (S._importExamCourses || []).forEach(course => {
    if (!S._importExamChecked.has(course.name)) return;
    const hasExisting = S.data.exams.some(x => x.course_name === course.name);
    if (hasExisting) {
      conflicts.push({ type: 'exam', key: course.name, label: `Exams: ${course.name}`, incoming: course });
    }
  });

  if (conflicts.length === 0) {
    performImport(new Set());
  } else {
    S._importConflicts = conflicts;
    showConflictDialog(conflicts);
  }
}

function performImport(overwriteSet) {
  (S._importGrad || []).forEach((c, i) => {
    if (!S._importGradChk.has(i)) return;
    const key = `${c.name}|${c.section||''}`;
    const existingIdx = S.data.grad_courses.findIndex(x => `${x.name}|${x.section||''}` === key);
    if (existingIdx >= 0) {
      if (!overwriteSet.has(key)) return;
      const ex = S.data.grad_courses[existingIdx];
      ex.day = c.day; ex.start_min = c.start_min; ex.end_min = c.end_min;
      ex.meetings = c.meetings || []; ex.exams = c.exams || [];
      ex.date_start = c.date_start || ''; ex.date_end = c.date_end || '';
    } else {
      S.data.grad_courses.push({id: uid(), name: c.name, section: c.section || '', day: c.day,
        start_min: c.start_min, end_min: c.end_min, meetings: c.meetings || [], exams: c.exams || [],
        date_start: c.date_start || '', date_end: c.date_end || ''});
    }
  });
  (S._importCourses || []).forEach(course => {
    const courseKey = `${course.subject} ${course.number}`;
    if (!S._importChecked.has(courseKey)) return;
    course.sections.forEach(sec => {
      const key = `${sec.name}|${sec.section||''}`;
      const existingIdx = S.data.labs.findIndex(x => `${x.name}|${x.section||''}` === key);
      let lab;
      if (existingIdx >= 0) {
        if (!overwriteSet.has(key)) return;
        lab = S.data.labs[existingIdx];
        lab.day = sec.day; lab.start_min = sec.start_min; lab.end_min = sec.end_min;
        lab.meetings = sec.meetings || []; lab.exams = sec.exams || [];
        lab.date_start = sec.date_start || ''; lab.date_end = sec.date_end || '';
      } else {
        lab = {id: uid(), name: sec.name, section: sec.section || '', day: sec.day,
          start_min: sec.start_min, end_min: sec.end_min,
          meetings: sec.meetings || [], exams: sec.exams || [], roles: [],
          date_start: sec.date_start || '', date_end: sec.date_end || ''};
        S.data.labs.push(lab);
      }
      attachCourseRole(lab);
    });
  });
  S.data.exams = S.data.exams || [];
  (S._importExamCourses || []).forEach(course => {
    if (!S._importExamChecked.has(course.name)) return;
    const hasExisting = S.data.exams.some(x => x.course_name === course.name);
    if (hasExisting) {
      if (!overwriteSet.has(course.name)) return;
      S.data.exams = S.data.exams.filter(x => x.course_name !== course.name);
    }
    course.exams.forEach(ex => {
      S.data.exams.push({
        id: uid(), name: 'Exam', course_name: course.name,
        date: ex.date, start_min: ex.start_min, end_min: ex.end_min,
        pe_value: 1.0, proctor_count: 1
      });
    });
  });
  delete S._importGrad; delete S._importGradChk;
  delete S._importCourses; delete S._importChecked;
  delete S._importExamCourses; delete S._importExamChecked;
  delete S._importConflicts; delete S._conflictOverwrite;
  markDirty(); closeModal(); renderLeftPanel(); renderRolesList();
}

function showConflictDialog(conflicts) {
  closeModal();
  S._conflictOverwrite = new Set(conflicts.map(c => c.key));
  const rows = conflicts.map(c => `
    <div class="modal-list-row">
      <label>
        <input type="checkbox" data-conflict-key="${escHtml(c.key)}" checked>
        ${escHtml(c.label)}
      </label>
    </div>`).join('');
  showModal(`<div class="modal-box">
    <h2>Import Conflicts (${conflicts.length} item${conflicts.length > 1 ? 's' : ''} already exist)</h2>
    <p class="modal-note">Checked items will be overwritten. Uncheck to keep existing data.</p>
    <div class="picker-list">${rows}</div>
    <div class="modal-footer">
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn-sm" onclick="performImport(new Set())">Skip All</button>
      <button class="btn-sm" onclick="performImport(new Set((S._importConflicts||[]).map(c=>c.key)))">Overwrite All</button>
      <button class="btn-sm btn-primary" onclick="conflictConfirm()">Confirm Import</button>
    </div>
  </div>`);
  document.querySelectorAll('input[data-conflict-key]').forEach(cb => {
    cb.onchange = () => toggleConflict(cb);
  });
}

function toggleConflict(cb) {
  const key = cb.dataset.conflictKey;
  if (cb.checked) S._conflictOverwrite.add(key); else S._conflictOverwrite.delete(key);
}


function conflictConfirm() {
  performImport(S._conflictOverwrite || new Set());
}

function jumpCalToExam(exam) {
  if (exam && !exam.tbd && exam.date) {
    const d = new Date(exam.date + 'T00:00:00');
    if (!isNaN(d)) {
      S.examCalYear  = d.getFullYear();
      S.examCalMonth = d.getMonth();
    }
  }
}

function renderExamsTab() {
  if (S.examSelId) {
    const selExam = S.data.exams.find(e => e.id === S.examSelId);
    jumpCalToExam(selExam);
  }
  renderExamList();
  renderExamCalendar();
  if (S.examSelId) renderExamForm(S.data.exams.find(e=>e.id===S.examSelId));
  else $id('exam-form').style.display = 'none';
}

function renderExamList() {
  const list = $id('exam-list');
  list.innerHTML = '';
  const sorted = [...(S.data.exams||[])].sort((a, b) => {
    if (a.tbd && !b.tbd) return 1;
    if (!a.tbd && b.tbd) return -1;
    if (a.date !== b.date) return (a.date||'') < (b.date||'') ? -1 : 1;
    return (a.start_min||0) - (b.start_min||0);
  });
  sorted.forEach(exam => {
    const row = el('div','item-row'+(exam.id===S.examSelId?' selected':''));
    row.onclick = () => { S.examSelId = exam.id; jumpCalToExam(exam); renderExamsTab(); };
    const courseLabel = examLabel(exam, '');
    const label = courseLabel
      ? `${courseLabel}: ${exam.name||'(unnamed)'}`
      : (exam.name||'(unnamed)');
    row.appendChild(el('span','item-name', escHtml(label)));
    const badge = el('span','item-badge', examDateTimeLabel(exam));
    row.appendChild(badge);
    list.appendChild(row);
  });
}

function renderExamForm(exam) {
  const form = $id('exam-form');
  if (!exam) { form.style.display='none'; return; }
  form.style.display = 'block';
  form.innerHTML = '';
  form.appendChild(el('h3',null,'Edit Exam'));

  // Name
  const nameInp = textInput(exam.name, v => { exam.name=v; markDirty(); renderExamList(); });
  form.appendChild(fgRow('Name', nameInp));

  // Course Name (dropdown from unique lab names + freetext)
  const cnG = el('div','form-group');
  const cnL = el('label'); cnL.textContent = 'Course Name';

  dateInp.disabled = !!exam.tbd;

  const timeTbdCb = document.createElement('input');
  timeTbdCb.type = 'checkbox'; timeTbdCb.checked = !!exam.time_tbd;
  timeTbdCb.style.cssText = 'margin:0;flex-shrink:0;';
  timeTbdWrap.appendChild(timeTbdCb);
  timeTbdWrap.appendChild(document.createTextNode('Time TBD'));
  dateRowInner.appendChild(timeTbdWrap);

  dateRow.appendChild(dateRowInner);
  form.appendChild(dateRow);

  // Start/End Time — greyed out (not hidden) when TBD or time_tbd, so the
  // last-entered values stay visible.
  const dtWrap = el('div');
  const timeRow = el('div','form-row');
  const stG = el('div','form-group');
  const stL = el('label'); stL.textContent = 'Start';

  stL.appendChild(stInp);
  stG.appendChild(stL); timeRow.appendChild(stG);
  const etG = el('div','form-group');
  const etL = el('label'); etL.textContent = 'End';

  etG.appendChild(etL); timeRow.appendChild(etG);

  tbdCb.onchange = () => {
    exam.tbd = tbdCb.checked;
    dateInp.disabled = exam.tbd;
    dateInp.style.opacity = exam.tbd ? '0.4' : '';
    timeTbdWrap.style.display = exam.tbd ? 'none' : 'flex';
    updateTimeInputsState();

  };

    exam.time_tbd = timeTbdCb.checked;

  // PE Value and Proctor Count
  const peRow = el('div','form-row');

  pvInp.oninput = () => { exam.pe_value=parseFloat(pvInp.value)||0; markDirty(); };
  pvL.appendChild(pvInp); pvG.appendChild(pvL); peRow.appendChild(pvG);
  const pcG = el('div','form-group');
  const pcL = el('label'); pcL.textContent = 'Proctors';

  pcL.appendChild(pcInp); pcG.appendChild(pcL); peRow.appendChild(pcG);

  // Actions: Duplicate + Delete

function duplicateExam(src) {
  S.data.exams = S.data.exams||[];
  const copy = Object.assign({}, src, {id: uid(), name: src.name + ' (copy)'});
  S.data.exams.push(copy);
  S.examSelId = copy.id;
  markDirty();
  renderExamsTab();
}

function createNewExam() {
  S.data.exams = S.data.exams||[];
  const exam = {id:uid(), name:'New Exam', course_name:'', section:'', date:'', start_min:540, end_min:660, pe_value:1.0, proctor_count:1, tbd:false, time_tbd:false};
  S.data.exams.push(exam);
  S.examSelId = exam.id;
  markDirty();
  renderExamsTab();
}

function deleteExam(id) {
  if (!confirm('Delete this exam?')) return;
  S.data.exams = (S.data.exams||[]).filter(e=>e.id!==id);
  S.data.proctor_assignments = (S.data.proctor_assignments||[]).filter(a=>a.exam_id!==id);
  S.examSelId = null;
  markDirty();
  renderExamsTab();
}

function renderExamCalendar() {
  const cal = $id('exam-calendar');
  if (!cal) return;
  cal.innerHTML = '';

  const allExams = S.data.exams||[];
  if (!allExams.length) return; // Hide calendar entirely when no exams

  // Separate TBD vs dated exams
  const tbdExams = [], datedExams = [];
  allExams.forEach(ex => { if (ex.tbd) tbdExams.push(ex); else if (ex.date) datedExams.push(ex); });

  // Build set of months (year*12+month) that have exams
  const examMonths = new Set();
  const examMap = {};
  datedExams.forEach(ex => {
    const d = new Date(ex.date+'T00:00:00');
    if (!isNaN(d)) examMonths.add(d.getFullYear()*12 + d.getMonth());
    if(!examMap[ex.date]) examMap[ex.date]=[];
    examMap[ex.date].push(ex);
  });

  // Sort exam months and build navigable range (first exam month to last, inclusive)
  const sortedMonths = [...examMonths].sort((a,b)=>a-b);
  let minMonth = sortedMonths.length ? sortedMonths[0] : S.examCalYear*12+S.examCalMonth;
  let maxMonth = sortedMonths.length ? sortedMonths[sortedMonths.length-1] : minMonth;

  // If there are dated exams, constrain calendar to the range
  if (sortedMonths.length) {
    const cur = S.examCalYear*12 + S.examCalMonth;
    if (cur < minMonth || cur > maxMonth) {
      // Snap to nearest boundary
      const nearest = cur < minMonth ? minMonth : maxMonth;
      S.examCalYear = Math.floor(nearest/12);
      S.examCalMonth = nearest%12;
    }
  }

  const year = S.examCalYear, month = S.examCalMonth;
  const curKey = year*12+month;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Nav — enable prev/next within the range [minMonth, maxMonth]
  const nav = el('div','cal-nav');
  const prevBtn = el('button','btn-sm','◀');
  if (curKey > minMonth) {
    prevBtn.onclick = () => {
      S.examCalMonth--; if(S.examCalMonth<0){S.examCalMonth=11;S.examCalYear--;}
      renderExamCalendar();
    };
  } else { prevBtn.disabled=true; prevBtn.style.opacity='0.3'; }
  const nextBtn = el('button','btn-sm','▶');
  if (curKey < maxMonth) {
    nextBtn.onclick = () => {
      S.examCalMonth++; if(S.examCalMonth>11){S.examCalMonth=0;S.examCalYear++;}
      renderExamCalendar();
    };
  } else { nextBtn.disabled=true; nextBtn.style.opacity='0.3'; }
  const title = el('span',null,`${monthNames[month]} ${year}`);
  nav.append(prevBtn, title, nextBtn);
  cal.appendChild(nav);

  // Grid
  const grid = el('div','cal-grid');
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => grid.appendChild(el('div','cal-hdr',d)));

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  // Previous month padding
  for (let i = firstDay-1; i >= 0; i--) {
    const d = el('div','cal-day other-month');
    d.innerHTML = `<div class="day-num">${prevDays-i}</div>`;
    grid.appendChild(d);
  }

  // Current month
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const examsOnDay = examMap[dateStr]||[];
    const d = el('div','cal-day'+(examsOnDay.length?' has-exam':''));
    let html = `<div class="day-num">${day}</div>`;
    examsOnDay.forEach(ex => {
      const courseLabel = examLabel(ex, '');
      const calLabel = courseLabel ? `${courseLabel}: ${ex.name}` : ex.name;
      html += `<span class="cal-exam-label" onclick="S.examSelId='${ex.id}';renderExamsTab();" title="${escHtml(calLabel)}">${escHtml(calLabel)}</span>`;
    });
    d.innerHTML = html;
    grid.appendChild(d);
  }

  // Next month padding
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= remaining; i++) {
    const d = el('div','cal-day other-month');
    d.innerHTML = `<div class="day-num">${i}</div>`;
    grid.appendChild(d);
  }

  cal.appendChild(grid);

  // TBD exams list below calendar
  if (tbdExams.length) {
    const tbdDiv = el('div','warn-box');
    tbdDiv.style.marginTop = '12px';
    tbdDiv.appendChild(el('strong',null,'TBD Exams'));
    const ul = el('ul','tbd-list');
    tbdExams.forEach(ex => {
      const li = document.createElement('li');
      const courseLabel = examLabel(ex, '');
      li.textContent = ex.name + (courseLabel ? ` (${courseLabel})` : '');
      li.onclick = () => { S.examSelId = ex.id; renderExamsTab(); };
      ul.appendChild(li);
    });
    tbdDiv.appendChild(ul);
    cal.appendChild(tbdDiv);
  }
}

function clearProctorAssignments() {
  S.data.proctor_assignments = (S.data.proctor_assignments||[]).filter(a=>a.locked);
  S.proctorDiag = {}; S.proctorStatus = null;
  markDirty(); renderProctoring();
}

async function runProctorSolver() {
  const btn = $id('btn-run-proctors');
  btn.textContent = '⏳ Solving…'; btn.disabled = true;
  try {
    const r = await fetch('/api/schedule-proctoring', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(S.data)
    });
    const result = await r.json();
    if (result.status === 'error') {
      alert('Solver error:\n' + result.message);
    } else {
      S.data.proctor_assignments = result.proctor_assignments;
      markDirty();
      renderProctoring(result.diagnostics, result.status);
    }
  } catch(e) { alert('Proctoring solver failed: ' + e); }
  btn.textContent = '▶ Assign Proctors'; btn.disabled = false;
}

function updateProctorPETotals() {
  const peDiv = $id('proctor-pe-total');
  if (!peDiv) return;
  const exams = S.data.exams||[];
  const examPE = exams.reduce((s,e)=>s+(e.pe_value||0)*(e.proctor_count||1), 0);
  const outsidePE = S.data.tas.reduce((s,ta)=>
    s + (ta.outside_proctoring||[]).reduce((ss,op)=>ss+(op.pe_value||0), 0), 0);
  const totalRequiredPE = examPE + outsidePE;
  const totalAvailablePE = S.data.tas.reduce((s,t)=>s+(t.max_pe??2.0), 0);

  let totalLine = `<strong>Total Required PE:</strong> ${totalRequiredPE.toFixed(1)}`;
  if (outsidePE > 0) {
    totalLine += ` (${examPE.toFixed(1)} from exams, ${outsidePE.toFixed(1)} from outside proctoring)`;
  }
  peDiv.style.cssText = 'margin:8px 0;font-size:var(--fs-sm);';
  peDiv.innerHTML = totalLine + '<br>' +
    `<strong>PE Available from TAs:</strong> ${totalAvailablePE.toFixed(1)}`;
}

function renderProctoring(diag, status) {
  if (diag !== undefined) { S.proctorDiag = diag||{}; S.proctorStatus = status||null; }
  diag = S.proctorDiag; status = S.proctorStatus;

  const unfilled = diag.unfilled_proctors||[];
  let html = '';
  if (status === 'partial' && unfilled.length) {
    html = '<h4>⚠ Partial Proctoring Schedule</h4>' +
      '<p><strong>Slots not fully filled:</strong></p><ul>' +
      unfilled.map(u => `<li><strong>${escHtml(u.exam_name)}</strong>: ${u.assigned}/${u.required} filled</li>`).join('') + '</ul>';
  }
  showWarnBox($id('proctor-diagnostics'), html);

  const tbl = $id('proctor-table');
  tbl.innerHTML = '';
  if (S.proctorViewMode === 'grid') renderProctorGrid(tbl);
  else renderProctorExamView(tbl);

  updateProctorPETotals();
  renderOutsideProctoring();

  renderProctorTASummary($id('proctor-ta-summary'));
}

// Exams sorted the way both proctoring views show them.
function sortedExamsForProctoring() {
  return [...(S.data.exams||[])].sort((a,b) => {
    const cmp = examLabel(a).localeCompare(examLabel(b));
    if (cmp !== 0) return cmp;
    if (a.tbd && !b.tbd) return 1;
    if (!a.tbd && b.tbd) return -1;
    return (a.date||'').localeCompare(b.date||'') || (a.start_min||0)-(b.start_min||0);
  });
}

function renderProctorExamView(container) {
  const tasMap = Object.fromEntries(S.data.tas.map(t=>[t.id,t]));
  const exams = sortedExamsForProctoring();
  if (!exams.length) { container.appendChild(el('p','help-text help-text-empty','No exams defined')); return; }

  const table = el('table','data-table');
  const thead = el('thead'); const thr = el('tr');
  ['Course/Section','Exam','Date/Time','Count','PE','Assigned Proctors'].forEach(h => thr.appendChild(el('th',null,h)));
  thead.appendChild(thr); table.appendChild(thead);
  const tbody = el('tbody');

  exams.forEach(exam => {
    const tr = el('tr');
    tr.appendChild(el('td',null,escHtml(examLabel(exam))));
    tr.appendChild(el('td',null,escHtml(exam.name)));
    tr.appendChild(el('td',null, examDateTimeLabel(exam)));

    const assigns = (S.data.proctor_assignments||[]).filter(a=>a.exam_id===exam.id);
    tr.appendChild(el('td',null,`${assigns.length}/${exam.proctor_count||1}`));
    tr.appendChild(el('td',null,(exam.pe_value||0).toFixed(1)));

    const assignCell = el('td');
    const roleDiv = el('div','role-cell role-chips-area');
    roleDiv.dataset.examId = exam.id;
    assigns.forEach(a => {
      const ta = tasMap[a.ta_id];
      const chip = el('div',`ta-chip${a.locked?' locked':''}`);
      chip.innerHTML = escHtml(ta?.name||a.ta_id);
      chip.draggable = true;
      chip.addEventListener('dragstart', e => {
        _dragProctorAssignment = {assignment: a, sourceExamId: exam.id};
        chip.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      chip.append(
        lockBadge(a.locked, () => { a.locked=!a.locked; markDirty(); renderProctoring(); }),
        xBtn(() => {
          S.data.proctor_assignments = S.data.proctor_assignments.filter(x=>x!==a);
          markDirty(); renderProctoring();
        }, 'Remove assignment'));
      roleDiv.appendChild(chip);
    });
    roleDiv.addEventListener('dragover', e => {
      if (!_dragProctorAssignment) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      roleDiv.classList.add('drag-over');
    });
    roleDiv.addEventListener('dragleave', () => roleDiv.classList.remove('drag-over'));
    roleDiv.addEventListener('drop', e => {
      e.preventDefault();
      roleDiv.classList.remove('drag-over');
      if (!_dragProctorAssignment) return;
      const {assignment, sourceExamId} = _dragProctorAssignment;
      _dragProctorAssignment = null;
      const destExamId = roleDiv.dataset.examId;
      if (destExamId === sourceExamId) return;
      // check TA not already assigned to dest exam
      const alreadyThere = (S.data.proctor_assignments||[]).some(x => x.exam_id===destExamId && x.ta_id===assignment.ta_id);
      if (alreadyThere) return;
      assignment.exam_id = destExamId;
      markDirty(); renderProctoring();
    });
    const addBtn = el('button','add-ta-btn','+ TA');
    addBtn.onclick = () => openProctorAssignModal(exam);
    roleDiv.appendChild(addBtn);
    assignCell.appendChild(roleDiv);
    tr.appendChild(assignCell);
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  container.appendChild(table);
}

// ── Proctor TA Summary table (always visible below exam view) ──
function renderProctorTASummary(container) {
  const examsMap = Object.fromEntries((S.data.exams||[]).map(e=>[e.id,e]));
  const rolesMap = Object.fromEntries(S.data.roles.map(r=>[r.id,r]));
  const labsMap  = Object.fromEntries(S.data.labs.map(l=>[l.id,l]));

  renderTASummaryTable(container,
    ['TA','Max PE','Used PE','Lab Assignments','Assigned Exams'],
    ta => {
      const taProctorAssigns = (S.data.proctor_assignments||[]).filter(a=>a.ta_id===ta.id);
      const usedPE = taProctorAssigns.reduce((sum,a) => sum + (examsMap[a.exam_id]?.pe_value||0), 0)
        + (ta.outside_proctoring||[]).reduce((s,op)=>s+(op.pe_value||0), 0);
      return [
        strongCell(ta.name),
        numCell(ta.max_pe ?? 2.0, v => { ta.max_pe = v; markDirty(); updateProctorPETotals(); }),
        usedPE.toFixed(1),
        (S.data.assignments||[]).filter(a=>a.ta_id===ta.id).map(a => assignChip(
          (displayName(labsMap[a.lab_id])||a.lab_id) + ' / ' + (rolesMap[a.role_id]?.label||a.role_id))),
        taProctorAssigns.map(a => {
          const exam = examsMap[a.exam_id];
          const course = examLabel(exam, '');
          return assignChip((course ? `${course} — ` : '') + (exam?.name||a.exam_id),
            {locked: a.locked, onToggle: () => { a.locked = !a.locked; markDirty(); renderProctoring(); }});
        }),
      ];
    });
}

function openProctorAssignModal(exam) {
  const addPE = exam.pe_value || 1.0;
  const existing = new Set(
    (S.data.proctor_assignments||[]).filter(a=>a.exam_id===exam.id).map(a=>a.ta_id)
  );

  const examsMap = Object.fromEntries((S.data.exams||[]).map(e=>[e.id,e]));
  const usedPE = {};
  S.data.tas.forEach(ta => { usedPE[ta.id] = 0; });
  (S.data.proctor_assignments||[]).forEach(a => {
    if (a.ta_id in usedPE) usedPE[a.ta_id] += examsMap[a.exam_id]?.pe_value || 0;
  });

  const hasDates = !exam.tbd && !exam.time_tbd && exam.date;

  openAssignPicker({
    titleHtml: `Assign Proctor — ${escHtml(exam.name)}`,
    isAssigned: ta => existing.has(ta.id),
    loadInfo: ta => `PE: ${usedPE[ta.id].toFixed(1)}/${Number(ta.max_pe??2.0).toFixed(1)}`,
    conflictReasons: ta => {
      // Cap and same-date double-booking are modal-only; the shared helper
      // covers labs, grad courses and commitments.
      const reasons = [];
      if (usedPE[ta.id] + addPE > (ta.max_pe??2.0) + 0.001) {
        reasons.push(`PE: ${(usedPE[ta.id]+addPE).toFixed(1)}/${Number(ta.max_pe??2.0).toFixed(1)} (over cap)`);
      }
      if (hasDates) {
        (S.data.proctor_assignments||[]).filter(a=>a.ta_id===ta.id).forEach(a => {
          const other = examsMap[a.exam_id];
          if (other && !other.time_tbd && other.date===exam.date &&
              overlap(exam.start_min, exam.end_min, other.start_min, other.end_min)) {
            reasons.push(`conflicts with ${other.name}`);
          }
        });
      }
      return reasons.concat(taExamConflictReasons(ta, exam));
    },
    onToggle: (ta, isAssigned) => {
      if (isAssigned) {
        S.data.proctor_assignments = S.data.proctor_assignments.filter(
          a=>!(a.exam_id===exam.id && a.ta_id===ta.id));
      } else {
        S.data.proctor_assignments = S.data.proctor_assignments||[];
        S.data.proctor_assignments.push({exam_id:exam.id, ta_id:ta.id, locked:true});
      }
    },
    rerender: renderProctoring,
  });
}

const VIEW_MODES = {
  sched:   {stateKey:'schedViewMode',   tableId:'sched-table',   rerender:() => renderSchedule()},
  proctor: {stateKey:'proctorViewMode', tableId:'proctor-table', rerender:() => renderProctoring()},
};

function setViewMode(which, mode) {
  const cfg = VIEW_MODES[which];
  S[cfg.stateKey] = mode;
  $id(`${which}-table-btn`)?.classList.toggle('active', mode === 'table');
  $id(`${which}-grid-btn`)?.classList.toggle('active', mode === 'grid');
  $id(cfg.tableId)?.parentElement?.classList.toggle('grid-mode', mode === 'grid');
  cfg.rerender();
}

// ════════════════════════════════════════════════════════════════
// CONFLICT-DETECTION HELPERS
// ════════════════════════════════════════════════════════════════
// These two are the single source of truth for "why can't this TA take this
// slot?" — both the assignment grids and the assign modals call them. The
// SE/PE cap check is deliberately left to the caller, which knows the role.

// Lookup maps rebuilt on demand; both helpers run once per grid cell, so they
// must not scan S.data.grad_courses / S.data.labs per call.
function conflictMaps() {
  return {
    gc:   Object.fromEntries(S.data.grad_courses.map(c => [c.id, c])),
    labs: Object.fromEntries(S.data.labs.map(l => [l.id, l])),
  };
}

function taLabConflictReasons(ta, lab, maps = conflictMaps()) {
  const reasons = [];
  const labMeetings = getMeetings(lab);

  // Grad course conflicts
  for (const gcId of (ta.grad_course_ids || [])) {
    const gc = maps.gc[gcId];
    if (!gc) continue;
    for (const lm of labMeetings) {
      for (const gm of getMeetings(gc)) {
        if (lm.day === gm.day && overlap(lm.start_min, lm.end_min, gm.start_min, gm.end_min)) {
          reasons.push(`conflicts with ${gc.name}`);
        }
      }
    }
  }
  // Other commitment conflicts
  for (const oc of (ta.other_commitments || [])) {
    for (const lm of labMeetings) {
      if (oc.day === lm.day && overlap(lm.start_min, lm.end_min, oc.start_min, oc.end_min)) {
        reasons.push(`conflicts with commitment (${fmtTime(oc.start_min)}–${fmtTime(oc.end_min)})`);
      }
    }
  }
  // Date conflicts, clamped to this lab's own active date range
  for (const dc of (ta.date_conflicts || [])) {
    if (dc.ignore_for_labs) continue;
    for (const w of expandDateConflictWeekdays(dc, lab.date_start, lab.date_end)) {
      for (const lm of labMeetings) {
        if (lm.day === w.weekday && overlap(lm.start_min, lm.end_min, w.start_min, w.end_min)) {
          reasons.push(`conflicts with date conflict "${dc.label || 'Conflict'}"`);
        }
      }
    }
  }
  return reasons;
}

function taExamConflictReasons(ta, exam, maps = conflictMaps()) {
  const reasons = [];
  const hasDates = !exam.tbd && !exam.time_tbd && exam.date;
  let examWd = null;
  if (hasDates) {
    // JS getDay() is 0=Sun; our model is 0=Mon.
    try { examWd = [6,0,1,2,3,4,5][new Date(exam.date + 'T00:00:00').getDay()]; } catch(e) {}
  }
  if (examWd === null || examWd === undefined) return reasons;

  const inRange = item => !item.date_start || !item.date_end ||
    (exam.date >= item.date_start && exam.date <= item.date_end);

  // Grad course conflicts
  for (const gcId of (ta.grad_course_ids || [])) {
    const gc = maps.gc[gcId];
    if (!gc) continue;
    for (const m of getMeetings(gc)) {
      if (m.day === examWd && overlap(exam.start_min, exam.end_min, m.start_min, m.end_min)
          && inRange(gc)) {
        reasons.push(`conflicts with ${gc.name}`);
      }
    }
    for (const gcEx of (gc.exams || [])) {
      if (gcEx.date === exam.date && overlap(exam.start_min, exam.end_min, gcEx.start_min, gcEx.end_min)) {
        reasons.push(`conflicts with ${gc.name} exam`);
      }
    }
  }
  // Lab assignment conflicts
  S.data.assignments.filter(a => a.ta_id === ta.id).forEach(a => {
    const lab = maps.labs[a.lab_id];
    if (!lab) return;
    for (const m of getMeetings(lab)) {
      if (m.day === examWd && overlap(exam.start_min, exam.end_min, m.start_min, m.end_min)
          && inRange(lab)) {
        reasons.push(`conflicts with lab ${lab.name}`);
      }
    }
  });
  // Other commitment conflicts
  for (const oc of (ta.other_commitments || [])) {
    if (oc.day === examWd && overlap(exam.start_min, exam.end_min, oc.start_min, oc.end_min)) {
      reasons.push(`conflicts with commitment`);
    }
  }
  // Date conflicts — always enforced, regardless of ignore_for_labs
  for (const dc of (ta.date_conflicts || [])) {
    if (dateConflictOverlapsDate(dc, exam.date, exam.start_min, exam.end_min)) {
      reasons.push(`conflicts with date conflict "${dc.label || 'Conflict'}"`);
    }
  }
  return reasons;
}

// ════════════════════════════════════════════════════════════════
// GRID VIEWS
// ════════════════════════════════════════════════════════════════
// TA × slot matrix, shared by the Schedule Labs and Schedule Proctoring tabs.
// A column carries {key, headHtml, headTitle, label} and everything else is
// supplied by the caller.
function renderAssignGrid(container, cfg) {
  container.innerHTML = '';
  const cols = cfg.columns;
  if (!cols.length) { container.innerHTML = `<p style="color:var(--text2)">${cfg.emptyColumns}</p>`; return; }

  const tas = [...S.data.tas].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  if (!tas.length) { container.innerHTML = '<p style="color:var(--text2)">No TAs configured.</p>'; return; }

  const tbl = el('table','assign-grid');

  // Header row
  const hrow = tbl.createTHead().insertRow();
  const thName = el('th','ta-name-col'); thName.textContent = '';
  hrow.appendChild(thName);
  for (const col of cols) {
    const th = el('th','col-head');
    const div = el('div','col-header', col.headHtml);
    div.title = col.headTitle;
    th.appendChild(div);
    hrow.appendChild(th);
  }

  // Body rows
  const maps = conflictMaps();
  const tbody = tbl.createTBody();
  for (const ta of tas) {
    const row = tbody.insertRow();
    const tdName = row.insertCell();
    tdName.className = 'ta-name-col';
    tdName.textContent = ta.name || '(unnamed)';

    for (const col of cols) {
      const td = row.insertCell();
      td.className = 'assign-cell';

      const asgn = cfg.findAssignment(ta, col);
      if (asgn) {
        td.classList.add(asgn.locked ? 'cell-locked' : 'cell-assigned');
        td.append(
          xBtn(() => cfg.onRemove(ta, col), 'Remove assignment', 'cell-rm'),
          lockBadge(asgn.locked),
        );
        td.title = `${ta.name} → ${col.label}${asgn.locked ? ' [locked]' : ''}`;
        td.onclick = () => cfg.onToggleLock(asgn);
      } else {
        const conflicts = cfg.conflictFn(ta, col, maps);
        if (conflicts.length) {
          td.classList.add('cell-conflict');
          td.title = conflicts.join('; ');
        } else {
          td.title = `Click to assign ${ta.name} → ${col.label}`;
        }
        td.onclick = () => cfg.onAdd(ta, col);
      }
    }
  }

  const gridWrap = el('div','assign-grid-wrap');
  gridWrap.appendChild(tbl);
  container.appendChild(gridWrap);
}

function renderScheduleGrid(container) {
  const rolesMap = Object.fromEntries(S.data.roles.map(r=>[r.id,r]));
  const columns = [];
  for (const lab of [...S.data.labs].sort((a,b) => (a.name||'').localeCompare(b.name||''))) {
    for (const rq of (lab.roles || [])) {
      if (!rq.count) continue;
      const role = rolesMap[rq.role_id];
      if (!role) continue;
      const name = displayName(lab);
      columns.push({
        lab, role,
        label: `${name} (${role.label})`,
        headTitle: `${name} (${role.label})`,
        headHtml: `${escHtml(name)}<br><span style="opacity:0.7">${escHtml(role.label)}</span>`,
      });
    }
  }

  renderAssignGrid(container, {
    columns,
    emptyColumns: 'No lab roles configured.',
    findAssignment: (ta, col) => S.data.assignments.find(
      a => a.lab_id === col.lab.id && a.role_id === col.role.id && a.ta_id === ta.id),
    conflictFn: (ta, col, maps) => taLabConflictReasons(ta, col.lab, maps),
    onAdd: (ta, col) => {
      S.data.assignments.push({lab_id: col.lab.id, role_id: col.role.id, ta_id: ta.id, locked: true});
      markDirty(); renderSchedule();
    },
    onRemove: (ta, col) => {
      S.data.assignments = S.data.assignments.filter(
        a => !(a.lab_id === col.lab.id && a.role_id === col.role.id && a.ta_id === ta.id));
      markDirty(); renderSchedule();
    },
    onToggleLock: asgn => { asgn.locked = !asgn.locked; markDirty(); renderSchedule(); },
  });
}

function renderProctorGrid(container) {
  const columns = sortedExamsForProctoring().map(exam => {
    const course = examLabel(exam);
    const dateLabel = exam.tbd ? 'TBD' : (exam.date || '—');
    const timeLabel = exam.tbd ? ''
      : exam.time_tbd ? 'Time TBD'
      : (exam.start_min != null) ? fmtRange(exam.start_min, exam.end_min) : '';
    return {
      exam,
      label: `${course}: ${exam.name}`,
      headTitle: `${course}: ${exam.name} (${dateLabel}${timeLabel ? ' ' + timeLabel : ''})`,
      headHtml: `${escHtml(course)}: ${escHtml(exam.name)}`
        + `<br><span style="opacity:0.7">${escHtml(dateLabel)}</span>`
        + (timeLabel ? `<br><span style="opacity:0.7">${escHtml(timeLabel)}</span>` : ''),
    };
  });

  renderAssignGrid(container, {
    columns,
    emptyColumns: 'No exams defined.',
    findAssignment: (ta, col) => (S.data.proctor_assignments || []).find(
      a => a.exam_id === col.exam.id && a.ta_id === ta.id),
    conflictFn: (ta, col, maps) => taExamConflictReasons(ta, col.exam, maps),
    onAdd: (ta, col) => {
      S.data.proctor_assignments = S.data.proctor_assignments || [];
      S.data.proctor_assignments.push({exam_id: col.exam.id, ta_id: ta.id, locked: true});
      markDirty(); renderProctoring();
    },
    onRemove: (ta, col) => {
      S.data.proctor_assignments = S.data.proctor_assignments.filter(
        a => !(a.exam_id === col.exam.id && a.ta_id === ta.id));
      markDirty(); renderProctoring();
    },
    onToggleLock: asgn => { asgn.locked = !asgn.locked; markDirty(); renderProctoring(); },
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showHelpModal() {
  const html = `
    <div class="modal-box" style="min-width:560px;">
      <h2>TA Scheduler — Help</h2>
      <div class="help-modal">
        <h3>Import Class Info</h3>
        <p>Use the <strong>Import Class Info</strong> button to load courses and lab sections from a
        departmental class list CSV. These can be obtained from
        <a href="https://www.apps.miamioh.edu/courselist/" target="_blank">apps.miamioh.edu/courselist</a>.
        Graduate courses are imported into the Graduate Courses tab; undergraduate sections
        are grouped by course number and imported into Lab Sections.</p>

        <h3>Lab Sections</h3>
        <p>Define undergraduate lab sections. For each lab, set the meeting time on the
        grid and configure how many TAs each role requires. Labs drive the scheduling.</p>

        <h3>Graduate Courses</h3>
        <p>Add graduate courses taken by TAs. Meeting times entered here are used to
        detect scheduling conflicts when assigning TAs to labs.</p>

        <h3>TAs</h3>
        <p>Add graduate TAs. Set experience level, maximum SE load, the grad courses
        they take, and any fixed commitments (blocks on the grid).</p>

        <h3>Exams</h3>
        <p>Define exam sessions for proctoring. Set date, time, PE value, and number
        of proctors needed. Exams can also be imported from a class list CSV. The
        calendar shows exams by month.</p>

        <h3>Schedule Labs</h3>
        <p>Use <strong>Assign TAs</strong> to auto-fill open slots, or use <strong>+ TA</strong> to assign manually.
        Lock assignments you want to keep; the solver won't overwrite locked slots.
        Switch between Lab View and TA View. Add outside duties (grading etc.) that count
        toward SE but have no meeting time. Export DOCX when done.</p>

        <h3>Schedule Proctoring</h3>
        <p>Use <strong>Assign Proctors</strong> to auto-fill exam proctoring slots.
        The solver respects PE caps and avoids time conflicts with labs, grad courses,
        and other commitments. TAs familiar with a course get a scoring bonus.</p>

        <h3>Summary</h3>
        <p>Read-only overview of the full schedule, organized three ways: by lab
        (which TAs cover each section), by exam (which TAs proctor each exam), and
        by TA (all labs and proctoring assignments with SE/PE totals). Each lab and
        exam heading includes a <strong>Copy e-mail addresses</strong> button when TAs have
        emails on file.</p>

        <h3>Meeting Finder</h3>
        <p>Heatmap showing when assigned TAs are busy across the week. Green = all
        free, yellow = some busy, red = all busy. Useful for scheduling meetings.</p>

        <h3>Key Concepts</h3>
        <ul>
          <li><strong>SE (Section Equivalent):</strong> unit of TA workload. A typical lab = 1.0 SE.</li>
          <li><strong>PE (Proctoring Equivalent):</strong> unit of proctoring workload. Independent from SE.</li>
          <li><strong>Experienced / Inexperienced:</strong> controls experience-preference soft constraints.</li>
          <li><strong>Locked assignments:</strong> preserved by the solver; unlocked ones can be replaced.</li>
          <li><strong>Other duties:</strong> SE-consuming responsibilities with no fixed meeting time.</li>
        </ul>
      </div>
      <div class="modal-footer">
        <button class="btn-sm btn-primary" onclick="closeModal()">Close</button>
      </div>
    </div>`;
  showModal(html);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); saveData(); }
  if (e.key==='Escape') closeModal();
});

window.addEventListener('beforeunload', e => {
  if (S.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});
